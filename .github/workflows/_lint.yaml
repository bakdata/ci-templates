name: Lint

on:
  pull_request:

jobs:
  jactionlint:
    name: jactionlint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install jactionlint
        uses: jdx/mise-action@v5
        with:
          version: "2026.10.5"
          install_args: "jactionlint shellcheck"

      - name: jactionlint
        run: jactionlint --pyflakes= --format=github
