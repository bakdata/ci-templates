name: "Lint actions and workflows"
description: "Lint all actions and workflows of a repository"
inputs:
  ref:
    description: "The ref name to checkout the repository."
    required: false
    default: ""
  action-lint-version:
    description: "The action lint repository version to use."
    required: false
    default: "v2.1.0"
  additional-flags:
    description: "Additional flags for jactionlint command"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Check out repository
      uses: bakdata/ci-templates/actions/checkout@1.81.1
      with:
        ref: "${{ inputs.ref }}"

    - name: Install mise tools
      uses: jdx/mise-action@v5
      with:
        version: "2026.10.5"

    - name: Check workflow files
      run: |
        bash <(curl https://raw.githubusercontent.com/jdx/jactionlint/${{ inputs.action-lint-version }}/scripts/download-jactionlint.bash)
        ./jactionlint -f github ${{ inputs.additional-flags }}
      shell: bash
